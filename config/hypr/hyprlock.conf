# Material 3 lock screen. Colours: ~/.config/hypr/hyprlock-colors.conf (from m3-theme)
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $surface_container_low
}

label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $primary
    font_size = 120
    font_family = Google Sans Flex Medium
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A %-d %B"
    color = $on_surface_variant
    font_size = 22
    font_family = Google Sans Flex
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    rounding = 28
    outline_thickness = 2
    outer_color = $outline
    inner_color = $surface_container_high
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    placeholder_text = Password
    font_family = Google Sans Flex
    dots_size = 0.22
    dots_spacing = 0.3
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
