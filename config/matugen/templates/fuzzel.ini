# Generated by matugen from ~/.config/matugen/templates/fuzzel.ini
# Edit the template, not this file, then run: m3-theme apply
[main]
font=Google Sans Flex:size=13,Roboto:size=13,Material Symbols Rounded:size=13
prompt="   "
placeholder=Search apps
icon-theme=Papirus
terminal=foot -e
layer=overlay
anchor=top
y-margin=120
width=46
lines=7
horizontal-pad=28
vertical-pad=22
inner-pad=14
line-height=34
image-size-ratio=0.35
match-counter=no

[border]
width=0
radius=28

[colors]
background={{colors.surface_container_high.default.hex_stripped}}ff
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.on_surface_variant.default.hex_stripped}}ff
placeholder={{colors.on_surface_variant.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff
selection={{colors.secondary_container.default.hex_stripped}}ff
selection-text={{colors.on_secondary_container.default.hex_stripped}}ff
selection-match={{colors.primary.default.hex_stripped}}ff
counter={{colors.on_surface_variant.default.hex_stripped}}ff
border={{colors.outline_variant.default.hex_stripped}}ff
